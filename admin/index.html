<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Überprüfung</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
:root{--bg:#080809;--card:rgba(28,28,30,.75);--text:#f5f5f7;--muted:#98989f;--accent:#2997ff;--border:rgba(255,255,255,.08);--danger:#ff453a;--success:#30d158}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;padding:40px 20px}
.wrap{max-width:800px;margin:auto}.login-card,.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:30px;backdrop-filter:blur(20px)}
h1{font-size:28px;margin:0 0 20px;display:flex;justify-content:space-between;align-items:center}
input,select{width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;background:#1c1c1e;color:#fff;font:inherit;margin-bottom:15px;outline:0}
button{padding:12px 20px;border-radius:12px;border:0;font-weight:700;cursor:pointer;transition:.2s}
.btn-p{background:var(--accent);color:#fff}.btn-d{background:var(--danger);color:#fff}.btn-s{background:var(--success);color:#fff}.btn-sec{background:#2c2c2e;color:#fff}
.item{border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:15px;background:rgba(255,255,255,.02);display:flex;justify-content:space-between;align-items:center;gap:15px}
.details{flex:1}.details h3{margin:0 0 6px;font-size:18px}.details p{margin:0 0 8px;color:var(--muted);font-size:14px}.meta{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:100}
.modal-content{background:#1c1c1e;border:1px solid var(--border);border-radius:20px;padding:25px;width:min(400px,90%)}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginSection" class="login-card">
    <h1>Admin Login</h1>
    <input type="password" id="passInput" placeholder="Passwort eingeben...">
    <button class="btn-p" onclick="login()">Anmelden</button>
  </div>

  <div id="adminSection" style="display:none">
    <h1>Überprüfung <button class="btn-sec" onclick="logout()">Abmelden</button></h1>
    <div id="list">Lade Einsendungen...</div>
  </div>
</div>

<div class="modal" id="rejectModal">
  <div class="modal-content">
    <h3>Grund für Ablehnung</h3>
    <select id="reasonSelect">
      <option value="Rassismus / Diskriminierung">Rassismus / Diskriminierung</option>
      <option value="Beleidigung / Hate Speech">Beleidigung / Hate Speech</option>
      <option value="Schadsoftware / Gefährlich">Schadsoftware / Gefährlich</option>
      <option value="Irreführende Beschreibung">Irreführende Beschreibung</option>
      <option value="Sonstiges">Sonstiges</option>
    </select>
    <input type="text" id="customReason" placeholder="Eigener Grund (optional)...">
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn-sec" onclick="closeRejectModal()">Abbrechen</button>
      <button class="btn-d" onclick="confirmReject()">Sperren & Ablehnen</button>
    </div>
  </div>
</div>

<script>
const API = "https://hello-world.avivehdddd-75f.workers.dev";
let pw = localStorage.getItem("adm_pw") || "", currentRejectId = null;

function login(){
  pw = document.querySelector("#passInput").value;
  localStorage.setItem("adm_pw", pw);
  loadList();
}
function logout(){ localStorage.removeItem("adm_pw"); location.reload(); }

async function loadList(){
  const r = await fetch(`${API}/submissions`, { headers: { "Authorization": `Bearer ${pw}` } });
  if(!r.ok){ alert("Falsches Passwort oder Fehler."); logout(); return; }
  document.querySelector("#loginSection").style.display = "none";
  document.querySelector("#adminSection").style.display = "block";
  
  const data = await r.json();
  const list = document.querySelector("#list");
  if(!data.submissions.length){ list.innerHTML = "<p style='color:var(--muted)'>Keine offenen Einsendungen.</p>"; return; }
  
  list.innerHTML = data.submissions.map(x => `
    <div class="item">
      <div class="details">
        <h3>${esc(x.name)}</h3>
        <p>${esc(x.description)}</p>
        <div class="meta">Von: <b>${esc(x.creator)}</b> | IP: ${esc(x.ip || "Unbekannt")}</div>
      </div>
      <div class="actions">
        <button class="btn-sec" onclick="downloadFile('${x.id}')">Datei</button>
        <button class="btn-s" onclick="approve('${x.id}')">✓ Genehmigen</button>
        <button class="btn-d" onclick="openRejectModal('${x.id}')">✕ Ablehnen</button>
      </div>
    </div>
  `).join("");
}

async function downloadFile(id){
  const res = await fetch(`${API}/download/${id}`, { headers: { "Authorization": `Bearer ${pw}` } });
  if(!res.ok) return alert("Download fehlgeschlagen");
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${id}.shortcut`;
  a.click();
}

async function approve(id){
  if(!confirm("Einsendung genehmigen?")) return;
  const res = await fetch(`${API}/approve/${id}`, { method: "POST", headers: { "Authorization": `Bearer ${pw}` } });
  if(res.ok){ alert("Genehmigt!"); loadList(); } else alert("Fehler beim Genehmigen");
}

function openRejectModal(id){ currentRejectId = id; document.querySelector("#rejectModal").style.display = "grid"; }
function closeRejectModal(){ currentRejectId = null; document.querySelector("#rejectModal").style.display = "none"; }

async function confirmReject(){
  const sel = document.querySelector("#reasonSelect").value;
  const custom = document.querySelector("#customReason").value.trim();
  const reason = custom || sel;
  
  const res = await fetch(`${API}/reject/${currentRejectId}`, {
    method: "POST",
    headers: { "Authorization": `Bearer ${pw}`, "Content-Type": "application/json" },
    body: JSON.stringify({ reason })
  });
  if(res.ok){ alert("Einsendung abgelehnt und IP gesperrt."); closeRejectModal(); loadList(); } else alert("Fehler beim Ablehnen");
}

function esc(s){ return String(s||"").replace(/[&<>"']/g, ""); }
if(pw) loadList();
</script>
</body>
</html>
