<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Kurzbefehle bearbeiten</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
body{font-family:'Inter',sans-serif;background:#080809;color:#f5f5f7;margin:0;padding:30px}
.wrap{max-width:800px;margin:auto}
h1{font-size:28px;margin-bottom:20px}
.card{background:rgba(28,28,30,.7);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:20px;margin-bottom:20px;backdrop-filter:blur(20px)}
label{display:block;font-size:12px;color:#98989f;margin:10px 0 4px;font-weight:600}
input,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#1c1c1e;color:#fff;font:inherit}
textarea{resize:vertical;height:60px}
button{background:#0071e3;color:#fff;border:0;padding:12px 20px;border-radius:10px;font-weight:700;cursor:pointer;margin-top:15px;width:100%}
button:hover{background:#2997ff}
.status{margin-top:10px;font-size:13px;color:#34c759;display:none}
</style>
</head>
<body>
<div class="wrap">
 <h1>⌘ Admin Dashboard</h1>
 <div class="card">
  <label for="shortcutSelect">Kurzbefehl auswählen:</label>
  <select id="shortcutSelect"><option>Lade Kurzbefehle...</option></select>
  
  <label for="inputName">Name:</label>
  <input id="inputName" placeholder="Z. B. Auto Clean">
  
  <label for="inputDesc">Beschreibung:</label>
  <textarea id="inputDesc" placeholder="Was macht der Kurzbefehl?"></textarea>
  
  <label for="inputEmoji">Haupt-Icon / Emoji:</label>
  <input id="inputEmoji" placeholder="Z. B. 🧹 oder ⚡">
  
  <label for="inputCreator">Ersteller:</label>
  <input id="inputCreator" placeholder="Z. B. jonas">
  
  <label for="inputAvatar">Profilbild / Avatar (Bild-URL oder Initialen/Emoji):</label>
  <input id="inputAvatar" placeholder="Z. B. https://site.de/avatar.jpg oder 🚀">
  
  <button id="saveBtn">Speichern & Übernehmen</button>
  <div class="status" id="status">Änderungen wurden gespeichert!</div>
 </div>
</div>

<script>
let files = [], overrides = {};
const sel = document.getElementById("shortcutSelect");

async function init(){
 const rFiles = await fetch("../shortcuts.json");
 files = await rFiles.json();
 
 try {
  const rOver = await fetch("../overrides.json");
  if(rOver.ok) overrides = await rOver.json();
 } catch(e){}

 sel.innerHTML = files.map(f => `<option value="${f}">${f}</option>`).join("");
 loadFields();
}

function loadFields(){
 const file = sel.value;
 const ov = overrides[file] || {};
 
 // Platzhalter aus Dateiname extrahieren
 let parts = file.replace(/\.shortcut$/i,"").split(" - ");
 
 document.getElementById("inputName").value = ov.name || parts[0] || "";
 document.getElementById("inputDesc").value = ov.desc || parts[1] || "";
 document.getElementById("inputEmoji").value = ov.emoji || parts[2] || "⚙️";
 document.getElementById("inputCreator").value = ov.creator || parts[3] || "Unbekannt";
 document.getElementById("inputAvatar").value = ov.avatar || "";
}

sel.onchange = loadFields;

document.getElementById("saveBtn").onclick = async () => {
 const file = sel.value;
 overrides[file] = {
  name: document.getElementById("inputName").value,
  desc: document.getElementById("inputDesc").value,
  emoji: document.getElementById("inputEmoji").value,
  creator: document.getElementById("inputCreator").value,
  avatar: document.getElementById("inputAvatar").value
 };

 // Speichern per PHP oder Backend API
 try {
  await fetch("save_overrides.php", {
   method: "POST",
   headers: {"Content-Type": "application/json"},
   body: JSON.stringify(overrides)
  });
  const st = document.getElementById("status");
  st.style.display = "block";
  setTimeout(()=> st.style.display = "none", 2000);
 } catch(e){
  alert("Fehler beim Speichern! Stelle sicher, dass save_overrides.php auf dem Server liegt.");
 }
};

init();
</script>
</body>
</html>
