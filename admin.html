<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard</title>
<style>
@import url('https://googleapis.com');
body{font-family:'Inter',sans-serif;background:#080809;color:#f5f5f7;margin:0;padding:30px;display:flex;flex-direction:column;align-items:center;gap:20px;min-height:90vh}
.card{background:rgba(28,28,30,.7);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:30px;width:100%;max-width:480px;backdrop-filter:blur(20px);box-sizing:border-box}
h1{font-size:22px;margin-top:0;color:#ff453a}
label{display:block;font-size:12px;color:#98989f;margin:14px 0 6px;font-weight:600}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#1c1c1e;color:#fff;font:inherit;box-sizing:border-box}
.btn-ban{background:#ff453a;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:700;cursor:pointer;margin-top:20px;width:100%;font-size:14px}
.btn-warn{background:#ff9f0a;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:700;cursor:pointer;margin-top:10px;width:100%;font-size:14px}
.status{margin-top:15px;font-size:13px;text-align:center}

/* Styles für die Shortcut-Liste */
.shortcut-list{margin-top:15px;max-height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:5px}
.shortcut-item{display:flex;justify-content:between;align-items:center;background:#1c1c1e;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.05);gap:10px}
.shortcut-name{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e5e5ea}
.btn-delete{background:#ff453a;color:#fff;border:0;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:0.2s}
.btn-delete:hover{background:#ff3b30}
.loader{text-align:center;color:#98989f;font-size:13px;padding:10px}
</style>
</head>
<body>

<!-- Bereich 1: Benutzerverwaltung -->
<div class="card">
 <h1>🛡️ Admin Control Panel</h1>
 
 <label for="targetUser">Benutzername:</label>
 <input id="targetUser" placeholder="z. B. Gamer123" required>

 <label for="reason">Grund / Nachricht:</label>
 <input id="reason" placeholder="z. B. Spam oder Verstoß gegen Regeln" required>

 <button class="btn-warn" onclick="executeAction('warn')">⚠️ Verwarnung aussprechen</button>
 <button class="btn-ban" onclick="executeAction('ban')">🚫 Benutzer BANNEN</button>

 <div id="statusMsg" class="status"></div>
</div>

<!-- Bereich 2: NEU - Kurzbefehle verwalten -->
<div class="card">
 <h1 style="color: #0071e3;">⌘ Kurzbefehle verwalten</h1>
 <div id="shortcutStatus" class="status" style="margin-bottom: 10px;"></div>
 <div class="shortcut-list" id="shortcutContainer">
  <div class="loader">Kurzbefehle werden geladen...</div>
 </div>
</div>

<script>
// GH CONFIG
const GH_USER = "DEIN_GITHUB_USERNAME";
const GH_REPO = "DEIN_REPO_NAME";
const GH_TOKEN = "DEIN_GITHUB_PERSONAL_ACCESS_TOKEN"; 
const FILE_PATH = "bans.json";
const SHORTCUTS_PATH = "shortcuts.json"; // Pfad zur Shortcuts-Datei

// Funktion für Ban/Warn (bestehend)
async function executeAction(type) {
 const username = document.getElementById("targetUser").value.trim();
 const reason = document.getElementById("reason").value.trim() || "Kein Grund angegeben";
 const status = document.getElementById("statusMsg");

 if(!username){ alert("Bitte Benutzernamen eingeben!"); return; }

 status.style.color = "#0071e3";
 status.textContent = "Speichere in GitHub...";

 try {
  const url = `https://github.com{GH_USER}/${GH_REPO}/contents/${FILE_PATH}`;
  let sha = "";
  let banData = {};

  const res = await fetch(url, { headers: { "Authorization": `token ${GH_TOKEN}` } });
  if(res.ok){
   const data = await res.json();
   sha = data.sha;
   banData = JSON.parse(atob(data.content));
  }

  banData[username.toLowerCase()] = {
   type: type,
   reason: reason,
   date: new Date().toISOString()
  };

  const updatedContent = btoa(JSON.stringify(banData, null, 2));

  const saveRes = await fetch(url, {
   method: "PUT",
   headers: {
    "Authorization": `token ${GH_TOKEN}`,
    "Content-Type": "application/json"
   },
   body: JSON.stringify({
    message: `${type.toUpperCase()} für ${username}`,
    content: updatedContent,
    sha: sha || undefined
   })
  });

  if(saveRes.ok){
   status.style.color = "#34c759";
   status.textContent = `Erfolgreich: ${username} wurde ${type === 'ban' ? 'GEBANNT' : 'VERWARNT'}!`;
  } else {
   throw new Error();
  }
 } catch(err) {
  status.style.color = "#ff453a";
  status.textContent = "Fehler beim Speichern!";
 }
}

// --- NEU: FUNKTIONEN FÜR SHORTCUTS LÖSCHEN ---

// Hilfsfunktion zum Escapen von HTML-Code
const esc = s => String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");

// Lädt die Liste der Shortcuts direkt aus GitHub, um das aktuelle SHA zu haben
async function loadShortcuts() {
 const container = document.getElementById("shortcutContainer");
 const status = document.getElementById("shortcutStatus");
 
 try {
  const url = `https://github.com{GH_USER}/${GH_REPO}/contents/${SHORTCUTS_PATH}`;
  const res = await fetch(url, { headers: { "Authorization": `token ${GH_TOKEN}` }, cache: "no-cache" });
  
  if(!res.ok) throw new Error("Konnte shortcuts.json nicht laden");
  
  const data = await res.json();
  const currentSha = data.sha;
  const files = JSON.parse(atob(data.content));
  
  container.innerHTML = "";
  
  if(files.length === 0) {
   container.innerHTML = '<div class="loader">Keine Kurzbefehle vorhanden.</div>';
   return;
  }
  
  files.forEach(file => {
   const item = document.createElement("div");
   item.className = "shortcut-item";
   
   // Extrahiere den Namen leserlich aus dem Dateinamen (analog zur Index-Logik)
   let cleanName = file.replace(/\.shortcut\$/i,"").split(" - ")[0] || file;
   
   item.innerHTML = `
    <span class="shortcut-name" title="${esc(file)}">${esc(cleanName)}</span>
    <button class="btn-delete" onclick="deleteShortcut('${esc(file)}', '${currentSha}')">Löschen</button>
   `;
   container.appendChild(item);
  });
 } catch (err) {
  container.innerHTML = '<div class="loader" style="color:#ff453a;">Fehler beim Laden der Shortcuts.</div>';
 }
}

// Löscht den ausgewählten Shortcut aus dem Array und pusht es zu GitHub
async function deleteShortcut(fileName, currentSha) {
 if(!confirm(`Möchtest du den Kurzbefehl "${fileName}" wirklich löschen?`)) return;
 
 const status = document.getElementById("shortcutStatus");
 status.style.color = "#0071e3";
 status.textContent = "Lösche Kurzbefehl...";
 
 try {
  const url = `https://github.com{GH_USER}/${GH_REPO}/contents/${SHORTCUTS_PATH}`;
  
  // 1. Neueste Version holen (falls sich das SHA geändert hat)
  const res = await fetch(url, { headers: { "Authorization": `token ${GH_TOKEN}` }, cache: "no-cache" });
  if(!res.ok) throw new Error();
  
  const data = await res.json();
  let files = JSON.parse(atob(data.content));
  
  // 2. Eintrag aus dem Array herausfiltern
  files = files.filter(f => f !== fileName);
  
  // 3. Zurück zu GitHub senden
  const updatedContent = btoa(JSON.stringify(files, null, 2));
  const saveRes = await fetch(url, {
   method: "PUT",
   headers: {
    "Authorization": `token ${GH_TOKEN}`,
    "Content-Type": "application/json"
   },
   body: JSON.stringify({
    message: `Kurzbefehl gelöscht: ${fileName}`,
    content: updatedContent,
    sha: data.sha
   })
  });
  
  if(saveRes.ok) {
   status.style.color = "#34c759";
   status.textContent = "Kurzbefehl erfolgreich gelöscht!";
   // Liste neu laden
   loadShortcuts();
  } else {
   throw new Error();
  }
 } catch (err) {
  status.style.color = "#ff453a";
  status.textContent = "Fehler beim Löschen!";
 }
}

// Initiales Laden beim Aufrufen der Seite
loadShortcuts();
</script>
</body>
</html>
